<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LottoBonus - หวยเบอร์ทอง</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  
  <!-- SweetAlert2 พร้อม Animate.css สำหรับลูกเล่นแอนิเมชัน -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --primary-blue: #0052D4;
      --mid-blue: #4364F7;
      --light-blue: #6FB1FC;
      --dark-blue: #003380;
      --gold: #fbc02d;
      --bg-color: #f0f4f8;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(#4364f715 1px, transparent 1px);
      background-size: 20px 20px;
      padding-bottom: 120px;
      color: #333;
    }

    /* Banner Image */
    .banner-img {
      width: 100%;
      height: auto;
      object-fit: cover;
      box-shadow: 0 10px 20px rgba(0, 82, 212, 0.2);
    }
    
    .footer-img {
      width: 100%;
      max-width: 900px;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin: 0 auto;
      display: block;
    }

    /* Info Bar */
    .info-bar {
      background: linear-gradient(135deg, var(--dark-blue), var(--mid-blue));
      color: #fff;
      padding: 12px 20px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0, 82, 212, 0.25);
      margin-top: -20px;
      position: relative;
      z-index: 10;
      border: 2px solid #fff;
    }

    /* Modern Tabs */
    .nav-custom {
      background: #fff;
      border-radius: 50px;
      padding: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      margin-top: 20px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .nav-custom .nav-link {
      border-radius: 50px;
      color: #666;
      font-weight: 600;
      padding: 12px 15px;
      transition: 0.3s;
    }
    .nav-custom .nav-link.active {
      background: linear-gradient(135deg, var(--mid-blue), var(--light-blue));
      color: #fff;
      box-shadow: 0 4px 12px rgba(67, 100, 247, 0.3);
    }

    /* Number Grid */
    .lotto-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    @media (min-width: 768px) {
      .lotto-grid { grid-template-columns: repeat(10, 1fr); gap: 15px; }
    }

    .num-card {
      background: #fff;
      border: 2px solid #e1e8ed;
      border-radius: 16px;
      padding: 15px 5px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 3px 10px rgba(0,0,0,0.02);
      user-select: none;
    }
    .num-card:active { transform: scale(0.95); }
    
    .num-card .digits {
      font-size: 1.6rem;
      font-weight: 700;
      color: #334e68;
      line-height: 1;
    }
    .num-card .status-label {
      font-size: 0.7rem;
      color: #829ab1;
      margin-top: 6px;
      font-weight: 500;
    }

    /* Selected State (Blue Gradient) */
    .num-card.selected {
      background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
      border-color: var(--mid-blue);
      box-shadow: 0 8px 20px rgba(0, 82, 212, 0.3);
      transform: translateY(-3px);
    }
    .num-card.selected .digits, .num-card.selected .status-label { color: #fff; }

    /* Sold State */
    .num-card.sold {
      background: #e1e8ed;
      border-color: #d9e2ec;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .num-card.sold .digits { color: #9fb3c8; text-decoration: line-through; }
    .num-card.sold .status-label { color: #829ab1; }

    /* Bottom Floating Cart */
    .bottom-cart-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-top: 3px solid var(--mid-blue);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.08);
      padding: 15px 20px;
      z-index: 1000;
      display: none;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .btn-gradient {
      background: linear-gradient(135deg, var(--primary-blue), var(--mid-blue));
      color: white;
      border: none;
    }
    .btn-gradient:hover {
      background: linear-gradient(135deg, var(--dark-blue), var(--primary-blue));
      color: white;
    }

    /* Digital Bill Card (Blue Theme) */
    #billCaptureArea {
      background: #fff;
      border-radius: 20px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 82, 212, 0.2);
      max-width: 400px;
      margin: 0 auto;
      border: 2px solid var(--mid-blue);
    }
    .bill-head {
      background: linear-gradient(135deg, var(--dark-blue), var(--mid-blue));
      color: #fff;
      padding: 25px 20px;
      text-align: center;
    }
    .bill-body { padding: 25px 20px; background: #f8fbff; }
    .bill-number-badge {
      background: linear-gradient(135deg, var(--mid-blue), var(--light-blue));
      color: #fff;
      font-size: 1.8rem;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 15px;
      margin: 5px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(67, 100, 247, 0.3);
    }
  </style>
</head>
<body>

  <!-- รูปภาพปกเว็บ (Header) -->
  <header>
    <img src="https://i.postimg.cc/7YP71khG/baen-nex-r-Lotto-Bonus-mngk-d-thxng-s-dhr.png" alt="Lotto Bonus Banner" class="banner-img">
  </header>

  <div class="container" style="max-width: 900px;">
    
    <!-- Info Bar -->
    <div class="d-flex flex-wrap justify-content-between align-items-center info-bar mx-auto" style="max-width: 800px;">
      <div class="fw-bold mb-1 mb-md-0">
        <i class="fa-regular fa-calendar-check text-warning me-1"></i> งวด: <span id="headerDrawDate" class="text-warning">กำลังโหลด...</span>
      </div>
      <div class="fw-bold">
        <i class="fa-solid fa-sack-dollar text-warning me-1"></i> รางวัล <span id="headerPrize" class="text-warning">6,000 บาท</span>
      </div>
      <div class="badge bg-white text-primary rounded-pill px-3 py-2 fs-6 shadow-sm mt-2 mt-md-0">
        เบอร์ละ <span class="fw-bold text-danger" id="headerPrice">100</span> ฿
      </div>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills nav-fill nav-custom mb-4 shadow-sm" id="mainTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabBoard" type="button">
          <i class="fa-solid fa-border-all me-1"></i> เลือกเบอร์
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabHistory" type="button">
          <i class="fa-solid fa-magnifying-glass me-1"></i> ประวัติการซื้อ
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- TAB 1: เลือกเบอร์ -->
      <div class="tab-pane fade show active" id="tabBoard">
        <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded-4 shadow-sm">
          <div class="fw-bold" style="color: var(--primary-blue);">
            <i class="fa-solid fa-circle-check me-1"></i> เบอร์ว่าง <span id="countAvail" class="fs-5">0</span>
          </div>
          <div class="d-flex gap-3 small fw-semibold text-muted">
            <span><i class="fa-solid fa-square" style="color: var(--light-blue);"></i> เลือกแล้ว (<span id="countSelected">0</span>)</span>
            <span><i class="fa-solid fa-square" style="color:#d9e2ec;"></i> ขายแล้ว (<span id="countSold">0</span>)</span>
          </div>
        </div>

        <div id="lottoGrid" class="lotto-grid">
          <!-- JS Generate Grid -->
        </div>

        <!-- รูปภาพ Footer ด้านล่างสุดของตารางเบอร์ -->
        <div class="mt-4 mb-5 text-center">
          <img src="https://i.postimg.cc/8Pyvt0fy/Lotto-Bonus-c-aywi-c-aycr-ng-100.png" alt="การันตีจ่ายจริง" class="footer-img">
        </div>
      </div>

      <!-- TAB 2: ประวัติการซื้อ -->
      <div class="tab-pane fade" id="tabHistory">
        <div class="bg-white p-4 rounded-4 shadow-sm mb-4 border-top border-4 border-primary">
          <h5 class="fw-bold mb-3" style="color: var(--primary-blue);"><i class="fa-solid fa-receipt me-2"></i>ตรวจสอบบิลย้อนหลัง</h5>
          <div class="input-group">
            <input type="text" id="searchInput" class="form-control form-control-lg bg-light border-0" placeholder="กรอกชื่อ หรือ เบอร์โทร..." onkeypress="if(event.key==='Enter') searchHistory()">
            <button class="btn btn-gradient px-4 fw-bold" onclick="searchHistory()">ค้นหา</button>
          </div>
        </div>
        <div id="searchResultsArea"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Cart -->
  <div id="bottomCartBar" class="bottom-cart-bar">
    <div class="container d-flex justify-content-between align-items-center" style="max-width: 900px;">
      <div>
        <div class="small text-muted mb-1">เลือก <span id="cartCount" class="fw-bold" style="color: var(--primary-blue);">0</span> เบอร์: <span id="cartNumbersList" class="fw-bold text-dark"></span></div>
        <div class="fs-4 fw-bold lh-1" style="color: var(--primary-blue);"><span id="cartTotalPrice">0</span> ฿</div>
      </div>
      <div>
        <button class="btn btn-gradient btn-lg rounded-pill px-4 fw-bold shadow-sm" onclick="openCheckout()">
          ชำระเงิน <i class="fa-solid fa-arrow-right ms-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow-lg">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" style="color: var(--primary-blue);"><i class="fa-solid fa-wallet me-2"></i>ยืนยันและชำระเงิน</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="p-3 rounded-4 text-center mb-4" style="background: #f0f4f8; border: 1px dashed var(--mid-blue);">
            <div class="text-muted small">ยอดโอนสุทธิ</div>
            <div class="fs-1 fw-bold mb-3" style="color: var(--primary-blue);"><span id="modalTotalAmount"></span>.-</div>
            
            <img id="promptPayQrImg" src="" class="img-fluid rounded-3 shadow-sm bg-white p-2 mb-2" style="width: 200px;">
            <div class="fw-bold text-dark" id="modalAccountName"></div>
            <div class="small text-muted">พร้อมเพย์: <span id="modalPromptPayId"></span></div>
          </div>

          <div class="mb-3">
            <input type="text" id="custNameInput" class="form-control form-control-lg bg-light border-0" placeholder="ชื่อ-นามสกุล ผู้ซื้อ">
          </div>
          <div class="mb-3">
            <input type="tel" id="custPhoneInput" class="form-control form-control-lg bg-light border-0" placeholder="เบอร์โทรศัพท์">
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold text-muted ms-1">แนบสลิปโอนเงิน</label>
            <input type="file" id="slipFileInput" class="form-control form-control-lg bg-light border-0" accept="image/*" onchange="previewSlip(this)">
            <div id="slipPreviewBox" class="text-center mt-3" style="display:none;">
              <img id="slipPreviewImg" src="" class="rounded-3 shadow-sm border border-primary" style="max-height: 200px;">
            </div>
          </div>

          <button class="btn btn-gradient btn-lg w-100 rounded-pill fw-bold" onclick="submitOrder()">
            ยืนยันการสั่งซื้อ
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bill Modal -->
  <div class="modal fade" id="billModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-transparent border-0">
        <div class="modal-body">
          <div id="billCaptureArea">
            <div class="bill-head">
              <h2 class="fw-bold mb-0 text-warning"><i class="fa-solid fa-gem me-2"></i>LottoBonus</h2>
              <div class="small text-white-50">ใบเสร็จรับเงินออนไลน์</div>
            </div>
            <div class="bill-body">
              <div class="d-flex justify-content-between small text-muted border-bottom pb-2 mb-3">
                <span>Ref: <strong id="bill_ref" class="text-dark"></strong></span>
                <span id="bill_time"></span>
              </div>
              <div class="text-center mb-4">
                <div class="text-muted small">งวดประจำวันที่</div>
                <div class="fs-5 fw-bold mb-3" style="color: var(--primary-blue);" id="bill_drawDate"></div>
                
                <div id="bill_numbersContainer" class="d-flex flex-wrap justify-content-center gap-2 mb-3"></div>
                
                <div class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-bold shadow-sm" style="font-size: 0.9rem;">
                  <i class="fa-solid fa-sack-dollar me-1"></i> ลุ้นรับ: <span id="bill_prize"></span>
                </div>
              </div>
              <div class="bg-white p-3 rounded-3 small border">
                <div class="d-flex justify-content-between mb-1">
                  <span class="text-muted">ชื่อลูกค้า:</span><span class="fw-bold" id="bill_custName"></span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <span class="text-muted">เบอร์โทร:</span><span class="fw-bold" id="bill_custPhone"></span>
                </div>
                <div class="d-flex justify-content-between border-top pt-2 mt-2 fs-6">
                  <span class="fw-bold">ยอดชำระ:</span><span class="fw-bold" style="color: var(--primary-blue);" id="bill_totalAmount"></span>
                </div>
              </div>
              <div class="text-center mt-4">
                <span class="badge bg-success rounded-pill px-4 py-2 fs-6 shadow-sm"><i class="fa-solid fa-check me-1"></i> ชำระเงินเรียบร้อย</span>
              </div>
            </div>
          </div>
          <div class="text-center mt-3">
            <button class="btn btn-warning btn-lg rounded-pill px-5 fw-bold shadow" onclick="downloadBill()">
              <i class="fa-solid fa-download me-2"></i> บันทึกรูปบิล
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ==========================================================
    // ลิงก์ Web App API ของคุณ
    // ==========================================================
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx1hIYWqeXAlG-D1hyVTUMXp0Ixv5wZpl6K9kZcPkg2nVH_ei16wh3aLDnj2MpstuSe/exec';

    // ตั้งค่าธีม SweetAlert2 แบบ Custom
    const mySwal = Swal.mixin({
      customClass: {
        confirmButton: 'btn btn-gradient rounded-pill px-4 ms-2',
        cancelButton: 'btn btn-light rounded-pill px-4'
      },
      buttonsStyling: false,
      showClass: { popup: 'animate__animated animate__fadeInDown animate__faster' },
      hideClass: { popup: 'animate__animated animate__fadeOutUp animate__faster' }
    });

    let appSettings = {};
    let bookedMap = {};
    let selectedNumbers = [];
    let currentSlipBase64 = '';
    let currentSlipMime = '';
    let currentSlipName = '';

    const thaiMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

    window.onload = () => loadData();

    function formatThaiDate(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-');
      return `${parseInt(d)} ${thaiMonths[parseInt(m)-1]} ${parseInt(y)+543}`;
    }

    async function callApi(payload) {
      const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
      return await res.json();
    }

    async function loadData() {
      mySwal.fire({ 
        title: 'กำลังเชื่อมต่อระบบ...', 
        html: 'โปรดรอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด',
        allowOutsideClick: false, 
        didOpen: () => Swal.showLoading() 
      });
      
      try {
        const res = await callApi({ action: 'getInitData' });
        mySwal.close();
        
        if (res.status === 'success') {
          appSettings = res.settings;
          bookedMap = res.bookedNumbers || {};
          selectedNumbers = [];
          
          document.getElementById('headerDrawDate').textContent = formatThaiDate(appSettings.CurrentDraw);
          document.getElementById('headerPrize').textContent = appSettings.GoldPrize;
          document.getElementById('headerPrice').textContent = appSettings.TicketPrice;
          
          renderGrid();
          updateCart();
        } else {
          mySwal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: res.message });
        }
      } catch (err) {
        mySwal.close();
        mySwal.fire({ icon: 'error', title: 'การเชื่อมต่อล้มเหลว', text: 'ไม่สามารถดึงข้อมูลได้ โปรดลองรีเฟรชหน้าเว็บอีกครั้ง' });
      }
    }

    function renderGrid() {
      const grid = document.getElementById('lottoGrid');
      grid.innerHTML = '';
      let sold = 0;

      for (let i = 0; i < 100; i++) {
        const numStr = String(i).padStart(2, '0');
        const isSold = bookedMap[numStr];
        const isSel = selectedNumbers.includes(numStr);
        
        const div = document.createElement('div');
        if (isSold) {
          sold++;
          div.className = 'num-card sold animate__animated animate__fadeIn';
          div.innerHTML = `<div class="digits">${numStr}</div><div class="status-label"><i class="fa-solid fa-lock"></i> ปิดขาย</div>`;
          div.onclick = () => {
             mySwal.fire({
               icon: 'info',
               title: 'ปิดขายแล้ว',
               text: `เบอร์ ${numStr} มีผู้สั่งซื้อไปแล้วครับ`,
               timer: 2000,
               showConfirmButton: false
             });
          };
        } else {
          div.className = `num-card animate__animated animate__fadeIn ${isSel ? 'selected animate__pulse' : ''}`;
          div.innerHTML = `<div class="digits">${numStr}</div><div class="status-label">${isSel ? 'เลือกแล้ว' : 'ว่าง'}</div>`;
          div.onclick = () => toggleNum(numStr);
        }
        grid.appendChild(div);
      }
      document.getElementById('countAvail').textContent = 100 - sold;
      document.getElementById('countSold').textContent = sold;
      document.getElementById('countSelected').textContent = selectedNumbers.length;
    }

    function toggleNum(n) {
      const idx = selectedNumbers.indexOf(n);
      if (idx > -1) selectedNumbers.splice(idx, 1);
      else selectedNumbers.push(n);
      selectedNumbers.sort();
      renderGrid();
      updateCart();
    }

    function updateCart() {
      const bar = document.getElementById('bottomCartBar');
      if (selectedNumbers.length > 0) {
        bar.style.display = 'block';
        document.getElementById('cartCount').textContent = selectedNumbers.length;
        document.getElementById('cartNumbersList').textContent = selectedNumbers.join(', ');
        document.getElementById('cartTotalPrice').textContent = (selectedNumbers.length * appSettings.TicketPrice).toLocaleString();
      } else {
        bar.style.display = 'none';
      }
    }

    function openCheckout() {
      const total = selectedNumbers.length * appSettings.TicketPrice;
      document.getElementById('modalTotalAmount').textContent = total.toLocaleString();
      document.getElementById('modalAccountName').textContent = appSettings.AccountName;
      document.getElementById('modalPromptPayId').textContent = appSettings.PromptPayID;
      
      const pp = String(appSettings.PromptPayID).replace(/[^0-9]/g, '');
      document.getElementById('promptPayQrImg').src = `https://promptpay.io/${pp}/${total}.png`;
      
      new bootstrap.Modal(document.getElementById('checkoutModal')).show();
    }

    function previewSlip(input) {
      const file = input.files[0];
      if (!file) return;
      currentSlipName = file.name;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max = 800;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * max / w); w = max; } 
            else { w = Math.round(w * max / h); h = max; }
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          currentSlipBase64 = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('slipPreviewImg').src = currentSlipBase64;
          document.getElementById('slipPreviewBox').style.display = 'block';
          document.getElementById('slipPreviewBox').classList.add('animate__animated', 'animate__fadeIn');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function submitOrder() {
      const name = document.getElementById('custNameInput').value.trim();
      const phone = document.getElementById('custPhoneInput').value.trim();
      if (!name || !phone || !currentSlipBase64) {
        return mySwal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณากรอกชื่อ เบอร์โทร และแนบสลิปโอนเงิน' });
      }

      mySwal.fire({ title: 'กำลังออกบิล...', html: 'โปรดรอสักครู่ ระบบกำลังอัปโหลดข้อมูล', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await callApi({
          action: 'bookNumbers', drawDate: appSettings.CurrentDraw,
          numbers: selectedNumbers, customerName: name, phone: phone,
          slipBase64: currentSlipBase64, slipFileName: currentSlipName
        });
        
        mySwal.close();
        if (res.status === 'success') {
          bootstrap.Modal.getInstance(document.getElementById('checkoutModal')).hide();
          
          // โชว์แอนิเมชันสำเร็จ
          mySwal.fire({
            icon: 'success',
            title: 'สั่งซื้อสำเร็จ!',
            text: 'ระบบได้ออกบิลให้ท่านเรียบร้อยแล้ว',
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            showBill(res.billData);
            loadData();
          });
          
        } else {
          mySwal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message });
          loadData();
        }
      } catch (err) {
        mySwal.close(); 
        mySwal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.toString() });
      }
    }

    function showBill(b) {
      document.getElementById('bill_ref').textContent = b.billRef;
      document.getElementById('bill_time').textContent = b.timestamp;
      document.getElementById('bill_drawDate').textContent = formatThaiDate(b.drawDate);
      document.getElementById('bill_prize').textContent = b.goldPrize;
      document.getElementById('bill_custName').textContent = b.customerName;
      document.getElementById('bill_custPhone').textContent = b.phone;
      document.getElementById('bill_totalAmount').textContent = Number(b.totalAmount).toLocaleString() + ' ฿';
      
      const box = document.getElementById('bill_numbersContainer');
      box.innerHTML = '';
      b.numbers.forEach(n => {
        const span = document.createElement('span');
        span.className = 'bill-number-badge animate__animated animate__zoomIn';
        span.textContent = n;
        box.appendChild(span);
      });
      new bootstrap.Modal(document.getElementById('billModal')).show();
    }

    function downloadBill() {
      const el = document.getElementById('billCaptureArea');
      html2canvas(el, { scale: 2, backgroundColor: null }).then(canvas => {
        const a = document.createElement('a');
        a.download = `LottoBonus_${document.getElementById('bill_ref').textContent}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
        
        mySwal.fire({
          toast: true,
          position: 'top-end',
          icon: 'success',
          title: 'บันทึกรูปบิลสำเร็จ',
          showConfirmButton: false,
          timer: 3000
        });
      });
    }

    async function searchHistory() {
      const kw = document.getElementById('searchInput').value.trim();
      if (!kw) return mySwal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกชื่อ หรือ เบอร์โทร' });
      
      mySwal.fire({ title: 'กำลังค้นหา...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      const res = await callApi({ action: 'searchHistory', keyword: kw });
      mySwal.close();
      
      const box = document.getElementById('searchResultsArea');
      box.innerHTML = '';
      if (res.status === 'success' && res.data.length > 0) {
        res.data.forEach((item, index) => {
          box.innerHTML += `
            <div class="bg-white p-3 rounded-4 shadow-sm mb-3 d-flex justify-content-between align-items-center animate__animated animate__fadeInUp" style="animation-delay: ${index * 0.1}s; border-left: 5px solid var(--primary-blue);">
              <div class="d-flex align-items-center gap-3">
                <div class="text-white rounded-3 px-3 py-2 fs-4 fw-bold" style="background: linear-gradient(135deg, var(--mid-blue), var(--light-blue));">${item.number}</div>
                <div>
                  <div class="fw-bold" style="color: var(--dark-blue);">งวด ${formatThaiDate(item.drawDate)}</div>
                  <div class="small text-muted">${item.customerName} (${item.phone})</div>
                  <div class="small text-muted" style="font-size: 0.7rem;">Ref: ${item.billRef}</div>
                </div>
              </div>
              <div class="text-end">
                <span class="badge bg-success mb-2 shadow-sm">${item.status}</span><br>
                <button class="btn btn-sm btn-outline-primary rounded-pill" onclick='showBill({
                  billRef: "${item.billRef}", timestamp: "${item.timestamp}", drawDate: "${item.drawDate}",
                  numbers: ["${item.number}"], customerName: "${item.customerName}", phone: "${item.phone}",
                  totalAmount: ${item.price}, goldPrize: "เงินสด 6,000 บาท"
                })'>ดูบิล</button>
              </div>
            </div>`;
        });
      } else {
        box.innerHTML = `<div class="text-center text-muted py-4 animate__animated animate__fadeIn"><i class="fa-solid fa-box-open fa-3x mb-3" style="color: var(--light-blue);"></i><br>ไม่พบประวัติการซื้อ</div>`;
      }
    }
  </script>
</body>
</html>
